name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    # Several runner types in parallel: GitHub's macOS arm64 pool is often full.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Coofix-Syria-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Coofix-Syria-unsigned-ipa-${{ matrix.os }}
          path: Coofix-Syria-unsigned.ipa
          retention-days: 30

      - name: Publish IPA to the "builds" branch
        run: |
          mkdir -p /tmp/out && cp Coofix-Syria-unsigned.ipa /tmp/out/
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add Coofix-Syria-unsigned.ipa
          git commit -qm "iOS build ${GITHUB_SHA::7} (${{ matrix.os }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
