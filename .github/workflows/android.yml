name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['lib/**', 'android/**', 'assets/**', 'pubspec.yaml', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish APK to the "builds-android" branch
        run: |
          mkdir -p /tmp/out && cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/Coofix-Syria.apk
          cd /tmp/out
          git init -q -b builds-android
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add Coofix-Syria.apk
          git commit -qm "Android build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds-android
